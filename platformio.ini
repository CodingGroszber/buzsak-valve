; PlatformIO Project Configuration File
; Board: ESP32-ACDC-RELAY4-M (ESP32_Relay X4, ESP32-WROOM-32E, 4 MB flash)
;
; ── Upload target — change default_envs to switch between OTA and USB ──
;   usb : wired, USB-TTL on COM6, IO0 jumpered to GND, then EN reset
;   ota : wireless, requires device on WiFi at 192.168.1.109
;
[platformio]
default_envs = ota

; ── Shared settings (applied to both envs) ───────────────────
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
; Relay click-test (1 = toggle all relays every second, 0 = relays stay idle)
build_flags = -DRELAY_TEST_ENABLED=0
lib_deps =
	ayushsharma82/ElegantOTA@^3.0.0

; ── OTA env — wireless upload via ElegantOTA HTTP (no firewall config needed) ─
[env:ota]
upload_port = 192.168.1.109
upload_protocol = custom
upload_command = python $PROJECT_DIR/scripts/http_ota.py $UPLOAD_PORT $SOURCE

; ── USB env — wired upload via esptool ───────────────────────
[env:usb]
upload_port = COM6
monitor_port = COM6
upload_protocol = esptool
